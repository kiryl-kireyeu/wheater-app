<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }}</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Open-Meteo ranking</p>
          <h1>Weather Scores</h1>
        </div>
        <a class="docs-link" href="/docs">Swagger</a>
      </header>

      <section class="controls" aria-label="Date range controls">
        <label class="field">
          <span>Start date</span>
          <input id="start-date" type="date" name="start_date" />
        </label>
        <label class="field">
          <span>End date</span>
          <input id="end-date" type="date" name="end_date" />
        </label>
        <button id="get-data" type="button">Get Data</button>
      </section>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

      <section class="table-section" aria-label="Weather scores table">
        <table>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">City</th>
              <th scope="col">Country</th>
              <th scope="col">Score</th>
              <th scope="col">Temp</th>
              <th scope="col">Wind</th>
              <th scope="col">Humidity</th>
              <th scope="col">Clouds</th>
            </tr>
          </thead>
          <tbody id="scores-table-body">
            <tr>
              <td colspan="8" class="empty-state">Choose dates and request weather scores.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
